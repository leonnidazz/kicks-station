<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulis ulasan | Kicks Station</title>
<meta name="robots" content="noindex">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@90..100,400..700&display=swap');
:root{--bg:#000;--card:#0b0b0c;--field:#111113;--line:#26262a;--text:#f4f4f5;--mute:#8b8b93;--btn:#fff;--btn-t:#000;--err:#f87171;--ok:#4ade80}
@media(prefers-color-scheme:light){:root{--bg:#f4f4f5;--card:#fff;--field:#f4f4f5;--line:#e4e4e7;--text:#000;--mute:#71717a;--btn:#000;--btn-t:#fff;--err:#dc2626;--ok:#16a34a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 64px}
a{color:inherit}h1{font-size:28px;letter-spacing:-.025em;line-height:1.1;margin:8px 0 8px}
p.lead{color:var(--mute);margin:0 0 8px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;margin-top:16px}
label{display:block;font-size:15px;margin:16px 0 6px}label:first-child{margin-top:0}
input,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:14px;color:var(--text);font:inherit}
textarea{min-height:88px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--mute)}
button{font:inherit;cursor:pointer}.primary{width:100%;margin-top:18px;background:var(--btn);color:var(--btn-t);border:0;border-radius:6px;padding:14px;font-weight:600}
.primary:disabled{opacity:.5;cursor:default}.hint{color:var(--mute);font-size:14px;margin:6px 0 0}
.msg{min-height:22px;margin-top:12px;font-size:15px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.item h2{font-size:18px;margin:0 0 4px}.item+.item{margin-top:16px}
.stars{display:flex;gap:4px;margin:10px 0 4px}
.stars button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;width:44px;height:44px;font-size:22px;line-height:1}
.stars button[aria-pressed=true]{background:var(--btn);color:var(--btn-t);border-color:var(--btn)}
.done{color:var(--mute)}.hide{display:none}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</head>
<body>
<main>
  <a href="index.html">Kembali ke toko</a>
  <h1>Tulis ulasan</h1>
  <p class="lead">Ulasan hanya untuk pembeli yang memesan lewat website ini, supaya setiap ulasan berasal dari pembelian nyata.</p>

  <section id="lookupCard" class="card">
    <label for="orderId">Nomor pesanan</label>
    <input id="orderId" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Contoh: KS-123-abc4d">
    <p class="hint">Ada di halaman setelah pembayaran dan di struk Midtrans.</p>
    <label for="phone">Nomor WhatsApp saat checkout</label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="08123456789">
    <div id="lookupMsg" class="msg" role="status"></div>
    <button type="button" class="primary" id="lookupBtn">Cari pesanan</button>
  </section>

  <section id="items" class="hide"></section>
</main>
<script>
(function () {
  var API = "https://kicks-station.onrender.com";
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function say(node, text, kind) { node.textContent = text || ""; node.className = "msg" + (kind ? " " + kind : ""); }
  function post(path, body) {
    return fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || !j.success) throw new Error(j.message || "Terjadi kesalahan. Coba lagi."); return j; }); });
  }
  var creds = { order_id: "", phone: "" };

  try {
    var q = new URLSearchParams(location.search).get("order") || localStorage.getItem("ks_last_order") || "";
    if (/^KS-\d+-[a-z0-9]+$/i.test(q)) $("orderId").value = q;
  } catch (e) {}

  function renderItem(item) {
    var box = el("div", "card item"); box.appendChild(el("h2", "", item.name));
    if (item.reviewed) { box.appendChild(el("p", "done", "Kamu sudah mengulas produk ini.")); return box; }
    var rating = 0, stars = el("div", "stars"); stars.setAttribute("role", "group"); stars.setAttribute("aria-label", "Rating untuk " + item.name);
    var btns = [1, 2, 3, 4, 5].map(function (n) {
      var b = el("button", "", String(n)); b.type = "button"; b.setAttribute("aria-pressed", "false"); b.setAttribute("aria-label", n + " dari 5");
      b.addEventListener("click", function () { rating = n; btns.forEach(function (x, i) { x.setAttribute("aria-pressed", i < n ? "true" : "false"); }); });
      stars.appendChild(b); return b;
    });
    box.appendChild(stars);
    box.appendChild(el("p", "hint", "1 = sangat kurang, 5 = sangat baik"));
    var lab = el("label", "", "Ceritakan pengalamanmu (opsional)"); var ta = el("textarea"); ta.maxLength = 600; ta.id = "c" + Math.random().toString(36).slice(2); lab.htmlFor = ta.id;
    box.appendChild(lab); box.appendChild(ta);
    var msg = el("div", "msg"); msg.setAttribute("role", "status"); box.appendChild(msg);
    var send = el("button", "primary", "Kirim ulasan"); send.type = "button"; box.appendChild(send);
    send.addEventListener("click", function () {
      if (!rating) return say(msg, "Pilih rating dulu.", "err");
      send.disabled = true; say(msg, "Mengirim...");
      post("/api/reviews", { order_id: creds.order_id, phone: creds.phone, product: item.name, rating: rating, comment: ta.value })
        .then(function (j) { say(msg, j.message, "ok"); [].slice.call(box.querySelectorAll("button,textarea")).forEach(function (n) { n.disabled = true; }); })
        .catch(function (e) { say(msg, e.message, "err"); send.disabled = false; });
    });
    return box;
  }

  $("lookupBtn").addEventListener("click", function () {
    var btn = $("lookupBtn"), msg = $("lookupMsg");
    creds.order_id = $("orderId").value.trim(); creds.phone = $("phone").value.trim();
    if (!creds.order_id || !creds.phone) return say(msg, "Isi nomor pesanan dan nomor WhatsApp.", "err");
    btn.disabled = true; say(msg, "Mencari pesanan...");
    post("/api/reviews/lookup", creds).then(function (j) {
      if (!j.eligible) { say(msg, j.message, ""); btn.disabled = false; return; }
      say(msg, ""); $("lookupCard").classList.add("hide");
      var list = $("items"); list.textContent = ""; list.classList.remove("hide");
      list.appendChild(el("p", "lead", "Pilih rating untuk setiap produk di pesananmu."));
      j.items.forEach(function (it) { list.appendChild(renderItem(it)); });
    }).catch(function (e) { say(msg, e.message, "err"); btn.disabled = false; });
  });
})();
</script>
</body>
</html>
